[project]
name = "wind-forecast-api"
version = "0.1.0"
description = "Day-ahead UK national wind forecast vs actuals API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
